services:
  postgres:
    image: postgres:16-alpine
    container_name: asset911-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asset911_user
      POSTGRES_PASSWORD: asset911_password
      POSTGRES_DB: asset911_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U asset911_user']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
